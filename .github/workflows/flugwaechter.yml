name: Flugwächter

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dakikada bir
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

concurrency:
  group: flugwaechter
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fiyatları kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python flugwaechter.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "flugwaechter-bot"
          git config user.email "flugwaechter-bot@users.noreply.github.com"
          git add -f state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Fiyat güncellemesi $(date -u +'%Y-%m-%d %H:%M')" && git push)

      - name: Debug dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
